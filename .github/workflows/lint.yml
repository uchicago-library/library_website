name: Linting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  python-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run flake8
      run: |
        flake8 .

    - name: Check black formatting
      run: |
        black --check --diff .

    - name: Check isort import sorting
      run: |
        isort --check-only --diff .

  javascript-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      run: |
        npm ci

    - name: Run ESLint
      run: |
        npx eslint . --ext .js

    - name: Check Prettier formatting
      run: |
        npx prettier --check "**/*.js"

  scss-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      run: |
        npm ci

    - name: Run Stylelint
      run: |
        npx stylelint "**/*.{css,scss}"

    - name: Check Prettier formatting for SCSS
      run: |
        npx prettier --check "**/*.{css,scss}"

  design-system:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      run: |
        npm ci

    - name: Build design system
      run: |
        npm run build:design-system

    - name: Check committed build outputs are current
      run: |
        # Fails when SCSS changed but the compiled CSS or tokens.json
        # wasn't rebuilt and committed (npm run build:design-system).
        git diff --exit-code design_system/static/ design_system/data/tokens.json

  template-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Check djhtml formatting
      run: |
        # Exclude static directory (collected static files / build artifacts)
        # and node_modules (third-party dependencies)
        find . -name "*.html" -not -path "*/static/*" -not -path "*/node_modules/*" -exec djhtml --check {} +
